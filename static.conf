server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trust proxy headers
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Disable automatic redirects
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404/index.html;
}
